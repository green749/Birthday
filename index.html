<html lang="en">

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4a98f">
	<title>Birthday Room | A little world made for you</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
	<style>

		.frame{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,4vw,54px);pointer-events:none}
		.topline,.footline,.controls,.heading{pointer-events:auto}.topline,.footline{display:flex;align-items:center;justify-content:space-between;gap:16px}

		.heading{position:absolute;top:24%;left:clamp(22px,8vw,112px);max-width:min(510px,52vw);animation:arrive .85s cubic-bezier(.2,.75,.2,1) both}

		.wish-button{display:inline-flex;align-items:center;gap:11px;min-height:50px;margin-top:25px;padding:0 19px;border:0;border-radius:2px;color:var(--paper);background:var(--berry);font:inherit;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .18s,background .18s}
		.wish-button:hover{transform:translateY(-3px);background:#923247}.wish-star{color:var(--sun);font-size:17px}.room-index{color:var(--berry)}.footnote{font-size:9px}

</head>
<body>
	<div class="frame">
		<header class="topline">
			<div class="wordmark"><span class="seal" aria-hidden="true">✳</span><span>The Birthday Room</span></div>
			<div class="controls"><button class="icon-button" id="sound-toggle" type="button" aria-label="Turn off birthday music" title="Turn off birthday music"><span aria-hidden="true">♪</span></button></div>
		</header>
		<main class="heading">
			<p class="eyebrow">A little world, made for you</p>
			<h1>HAPPY<span>BIRTHDAY.</span></h1>
			<p class="heading-rule">One more trip around the sun</p>
			<button class="wish-button" id="wish-button" type="button"><span class="wish-star" aria-hidden="true">✳</span>Make a wish</button>
		</main>
		<footer class="footline"><span class="footnote">Good things are tucked into every corner.</span><span class="room-index">A day all your own &nbsp;/&nbsp; 01</span></footer>
	</div>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>

		import * as THREE from 'three';

		addBalloon(-5,4.7,.2,palette.berry,.2);addBalloon(-4.25,5.4,-.3,palette.sun,1.2);addBalloon(-5.5,5.55,-.5,palette.blue,2);addBalloon(4.8,4.8,.2,palette.lilac,.7);addBalloon(5.45,5.55,-.3,palette.coral,1.7);addBalloon(4.35,5.45,-.5,palette.sun,2.8);

		for(const x of [-5.55,5.55]){cylinder(decor,[x,.42,-3.8],.45,.54,.84,x<0?mats.coral:mats.blue);for(let i=0;i<6;i++){const angle=i*.95;const leaf=sphere(decor,[x+Math.cos(angle)*.35,1.7+(i%2)*.14,-3.8+Math.sin(angle)*.35],[.13,.38,.1],i%2?mats.ink:mats.teal);leaf.rotation.z=Math.cos(angle)*.42;leaf.rotation.x=Math.sin(angle)*.38}}

		const cake=new THREE.Group();cake.position.set(0,.72,-.05);scene.add(cake);
		cylinder(cake,[0,.16,0],1.08,1.08,.18,mats.cream);cylinder(cake,[0,.67,0],.99,1.02,.84,mats.pink);cylinder(cake,[0,1.18,0],.72,.75,.34,mats.cream);cylinder(cake,[0,1.4,0],.74,.74,.12,mats.berry);

		const clickables=[],gifts=[];
		function makeGift(x,z,color,ribbon,index,scale=1){const group=new THREE.Group();group.position.set(x,0,z);group.scale.setScalar(scale);group.userData={isGift:true,open:false,message:giftMessages[index],home:new THREE.Vector3(x,0,z)};scene.add(group);const base=material(color,{roughness:.36});const body=box(group,'gift',[0,.43,0],[.94,.86,.8],base);body.userData.gift=group;const lid=new THREE.Group();lid.position.y=.89;group.add(lid);box(lid,'lid',[0,.1,0],[1.08,.22,.94],base);box(group,'ribbon',[0,.44,.41],[.15,.9,.025],material(ribbon));box(group,'bow',[0,1.02,0],[.42,.12,.2],material(ribbon));const starShape=new THREE.Shape();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2===0?.27:.12,p=[Math.cos(a)*r,Math.sin(a)*r];i===0?starShape.moveTo(...p):starShape.lineTo(...p)}starShape.closePath();const prize=new THREE.Mesh(new THREE.ExtrudeGeometry(starShape,{depth:.08,bevelEnabled:true,bevelSize:.025,bevelThickness:.025,bevelSegments:2}),material(palette.sun,{metalness:.18,emissive:palette.gold,emissiveIntensity:.3}));prize.position.set(0,.95,0);prize.scale.setScalar(.01);group.add(prize);group.userData.lid=lid;group.userData.prize=prize;clickables.push(group,body);gifts.push(group)}
		makeGift(-2.35,.15,palette.coral,palette.cream,0,1.08);makeGift(2.05,.05,palette.teal,palette.sun,1,.95);makeGift(-3.35,-2,palette.lilac,palette.berry,2,.82);makeGift(3.25,-1.5,palette.blue,palette.coral,3,.9);

		const toast=document.querySelector('#toast');let toastTimeout;

		const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let dragStart=null,lastPointer=null,dragging=false;

		renderer.domElement.addEventListener('wheel',event=>{orbit.radius=THREE.MathUtils.clamp(orbit.radius+event.deltaY*.008,12,22);updateCamera()},{passive:true});

		const clock=new THREE.Clock();
		function animate(){const time=clock.getElapsedTime();for(const balloon of balloons){balloon.position.y=balloon.userData.base+Math.sin(time*1.25+balloon.userData.phase)*.18;balloon.rotation.z=Math.sin(time*.75+balloon.userData.phase)*.07}for(let i=0;i<ambientConfetti.length;i++){const piece=ambientConfetti[i];piece.position.y-=piece.userData.drift*.004;if(piece.position.y<.2)piece.position.y=7+Math.random()*2;piece.position.x+=Math.sin(time+piece.userData.phase)*.002;piece.rotation.x+=.006;piece.rotation.z+=.004}for(const gift of gifts){if(gift.userData.open){gift.userData.lid.rotation.z=THREE.MathUtils.damp(gift.userData.lid.rotation.z,.35,4,1/60);gift.userData.lid.position.y=THREE.MathUtils.damp(gift.userData.lid.position.y,1.45,4,1/60);gift.userData.prize.scale.setScalar(THREE.MathUtils.damp(gift.userData.prize.scale.x,1,5,1/60));gift.userData.prize.rotation.y+=.02;gift.userData.prize.position.y=1.2+Math.sin(time*2.5)*.12}gift.position.y=gift.userData.bounceUntil>performance.now()?Math.sin(time*23)*.15:THREE.MathUtils.damp(gift.position.y,0,7,1/60)}for(let i=burstPieces.length-1;i>=0;i--){const p=burstPieces[i];p.userData.life-=1/60;p.userData.velocity.y-=4/60;p.position.addScaledVector(p.userData.velocity,1/60);p.rotation.x+=p.userData.spin/60;p.rotation.y+=p.userData.spin/80;if(p.userData.life<=0){scene.remove(p);p.material.dispose();burstPieces.splice(i,1)}}glow.intensity=46+Math.sin(time*2)*2;renderer.render(scene,camera)}
		renderer.setAnimationLoop(animate);
		window.addEventListener('resize',()=>{renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);updateCamera()});
		window.addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);if(audioContext&&audioContext.state!=='closed')audioContext.close()},{once:true});
	</script>
</body>
</html>
